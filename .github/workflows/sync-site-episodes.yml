name: Sync site episodes

# Keeps outofourdepth.com's saved episode list in step with YouTube (new uploads, renamed titles,
# deleted videos). The homepage also picks up new uploads live; this makes them permanent, keeps
# the numbering right past the feed's newest 15, and refreshes the no-JS fallback.
# A commit here triggers Vercel's normal deploy. Run it by hand from the Actions tab any time.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-site-episodes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync episodes from YouTube
        run: node scripts/sync-site-episodes.js

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- website/config.js website/index.html; then
            echo "No episode changes."
            exit 0
          fi
          git config user.name "oood-site-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/config.js website/index.html
          git commit -m "Sync site episodes from YouTube"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
